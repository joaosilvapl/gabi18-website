<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <defs>
    <!-- Animated rainbow-ish gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color"
                 values="#38bdf8;#a78bfa;#f472b6;#22d3ee;#38bdf8"
                 dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a78bfa">
        <animate attributeName="stop-color"
                 values="#a78bfa;#f472b6;#22d3ee;#38bdf8;#a78bfa"
                 dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color"
                 values="#f472b6;#22d3ee;#38bdf8;#a78bfa;#f472b6"
                 dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Soft glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Text group centered for scale animation -->
  <g transform="translate(120 42)" filter="url(#glow)">
    <g>
      <!-- Scale animation from center -->
      <animateTransform
        attributeName="transform"
        type="scale"
        values="1;1.06;1"
        dur="2.6s"
        repeatCount="indefinite"
        calcMode="spline"
        keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
      
      <text
        x="0"
        y="0"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="36"
        font-weight="800"
        fill="url(#textGrad)"
      >
        Gabi 18
        <!-- Soft opacity breathing -->
        <animate
          attributeName="opacity"
          values="1;0.82;1"
          dur="2.6s"
          repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
