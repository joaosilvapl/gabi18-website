<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gabi18</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overflow-x: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: system-ui, sans-serif;
      background: #f8f8f8;
    }
    #backgroundWrapper {
      width: 100%;
      min-height: 100vh;
    }
    .languageButton {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 0.75rem;
      width: 100%;
      max-width: none;
      text-align: left;
      box-sizing: border-box;
    }
    .languageButton img {
      width: 1.8rem;
      height: auto;
      display: block;
    }
    #buttonGroup {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin: 1.5rem auto;
      padding: 0 1rem;
      box-sizing: border-box;
      max-width: 44rem;
      width: 100%;
    }
    #buttonGroup button {
      min-width: 12rem;
      max-width: 18rem;
      width: auto;
      box-sizing: border-box;
    }
    #languageSelectOverlay > div,
    #drawingOverlay > div,
    #nicknameOverlay > div {
      width: min(36rem, 100%);
      max-width: 100%;
      box-sizing: border-box;
      margin: 0 0.5rem;
    }
    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    #videoContainer {
      position: relative;
      max-width: 100%;
      width: 100%;
      margin: 0 auto;
      padding: 0 1rem;
      box-sizing: border-box;
      text-align: center;
    }
    #videoContainer iframe {
      width: 100%;
      max-width: 100%;
    }
    #backgroundWrapper {
      background-image: url('gabivolution.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    @media (max-width: 640px) {
      #backgroundWrapper {
        background-image: url('gabivolution_vertical.png');
      }
      #languageSelectOverlay {
        padding: 0.75rem;
      }
      #languageSelectOverlay > div {
        width: calc(100% - 1rem);
        padding: 1.25rem;
      }
      .languageButton {
        font-size: 1.05rem;
        padding: 1.1rem 1rem;
        justify-content: flex-start;
      }
      .languageButton img {
        width: 1.6rem;
      }
      #buttonGroup {
        flex-direction: column;
        align-items: stretch;
        gap: 0.75rem;
      }
      #buttonGroup button {
        max-width: 100%;
        min-width: auto;
      }
      #drawingOverlay > div,
      #nicknameOverlay > div {
        width: 95vw;
        padding: 1.25rem;
      }
      #drawingOverlay > div {
        width: 95vw;
      }
      #drawingCarousel {
        width: 100%;
      }
      #drawingControls {
        justify-content: center;
        gap: 0.75rem;
      }
      #drawingControls button {
        width: 2.2rem;
        height: 2.2rem;
        font-size: 1.2rem;
      }
      #closeVideoContainer {
        top: 0.5rem;
        right: 0.5rem;
      }
      #languageSelectOverlay > div h2,
      #nicknameOverlay h2,
      #drawingOverlay h2 {
        font-size: 1.5rem;
      }
      #drawingOverlay > div {
        width: calc(100% - 1rem);
        padding: 1.25rem;
      }
      #drawingCarousel {
        flex-direction: column;
      }
      #drawingPreview {
        width: 100%;
      }
      #drawingPreview img {
        width: 100%;
        max-height: 65vh;
      }
      #drawingCarousel button {
        width: 3rem;
        height: 3rem;
      }
      #prevDrawing,
      #nextDrawing {
        order: 3;
      }
      #drawingPreview {
        order: 2;
      }
      #drawingLabel {
        order: 2;
      }
      #drawingCarousel {
        align-items: center;
      }
      #drawingCarousel button {
        margin-top: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div id="backgroundWrapper" style="width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center;">
    <div style="width: 100%;">
      <h1><img src="gabi18animated.svg" alt="gabi18animated" style="width: auto; height: auto; display: block; margin: 0 auto; transform: scale(2); transform-origin: center;"></h1>
      <div id="languageSelectOverlay" style="position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10001; display: flex; align-items: center; justify-content: center; padding: 2rem;">
        <div style="width: min(36rem, 100%); background: white; border-radius: 1rem; padding: 2.5rem; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.25);">
          <h2 style="margin-top: 0; margin-bottom: 1.5rem; color: #1e88e5; font-size: 2rem;">Choose a language</h2>
          <div style="display: flex; flex-direction: column; gap: 1rem;">
            <button class="languageButton" data-lang="pt" style="padding: 1.5rem 1.75rem; border: 2px solid #1e88e5; background: white; color: #1e88e5; border-radius: 1rem; font-weight: 700; cursor: pointer; font-size: 1.3rem; min-width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem;">
              <img src="brazil_flag.webp" alt="Brazil flag" style="width: 1.8rem; height: auto; display: block;">
              Português
            </button>
            <button class="languageButton" data-lang="pl" style="padding: 1.5rem 1.75rem; border: 2px solid #1e88e5; background: white; color: #1e88e5; border-radius: 1rem; font-weight: 700; cursor: pointer; font-size: 1.3rem; min-width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem;">
              <img src="poland_flag.webp" alt="Poland flag" style="width: 1.8rem; height: auto; display: block;">
              Polski
            </button>
            <button class="languageButton" data-lang="en" style="padding: 1.5rem 1.75rem; border: 2px solid #1e88e5; background: white; color: #1e88e5; border-radius: 1rem; font-weight: 700; cursor: pointer; font-size: 1.3rem; min-width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.75rem;">
              <img src="usa_flag.webp" alt="USA flag" style="width: 1.8rem; height: auto; display: block;">
              English
            </button>
          </div>
        </div>
      </div>
      <div id="buttonGroup" style="display: none; justify-content: center; gap: 1rem; flex-wrap: wrap; margin: 1.5rem auto;">
        <button id="nicknameHistoryButton" style="padding: 0.9rem 1.2rem; border: 2px solid #1e88e5; background: white; color: #1e88e5; border-radius: 0.75rem; font-weight: 600; cursor: pointer; min-width: 120px;">Nickname history</button>
        <button id="drawingsHistoryButton" style="padding: 0.9rem 1.2rem; border: 2px solid #1e88e5; background: white; color: #1e88e5; border-radius: 0.75rem; font-weight: 600; cursor: pointer; min-width: 120px;">Drawing history</button>
        <button id="playVideoButton" style="padding: 0.9rem 1.2rem; border: 2px solid #1e88e5; background: white; color: #1e88e5; border-radius: 0.75rem; font-weight: 600; cursor: pointer; min-width: 120px;">Play video</button>
      </div>
      <div id="nicknameOverlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9999; align-items: center; justify-content: center;">
        <div style="display: inline-block; width: min(60vw, 36rem); max-width: calc(100vw - 2rem); min-width: 18rem; background: white; border-radius: 1rem; padding: 2rem; position: relative; text-align: center; color: #111; box-shadow: 0 20px 60px rgba(0,0,0,0.2);">
          <button id="closeNicknameOverlay" style="position: absolute; top: 1rem; right: 1rem; background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: #555;">✕</button>
          <h2 style="margin-top: 0; color: #1e88e5;">Nickname history</h2>
          <ul style="margin: 1rem 0 0; padding-left: 0; line-height: 1.8; list-style: none; text-align: center;">
            <li>Gabrysia</li>
            <li>Żaba</li>
            <li>Kika</li>
            <li>Gaba</li>
            <li>Dzik</li>
            <li>Bebezinha</li>
            <li>Eden</li>
          </ul>
        </div>
      </div>
      <div id="drawingOverlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 9998; align-items: center; justify-content: center;">
        <div style="width: min(95vw, 65rem); max-width: calc(100vw - 2rem); background: white; border-radius: 1rem; padding: 1.5rem; position: relative; color: #111; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.2);">
          <button id="closeDrawingOverlay" style="position: absolute; top: 1rem; right: 1rem; background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: #555;">✕</button>
          <h2 style="margin-top: 0; color: #1e88e5;">Drawing history</h2>
          <div id="drawingCarousel" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;">
            <div id="drawingPreview" style="display: flex; flex-direction: column; align-items: center; width: 100%; gap: 0.75rem;">
              <img id="centerImage" src="" alt="Current drawing" style="width: 100%; max-height: 70vh; object-fit: contain; border-radius: 1rem; border: 2px solid #1e88e5;">
              <div id="drawingLabel" style="font-weight: 700; color: #1e88e5;">Year</div>
            </div>
            <div id="drawingControls" style="display: flex; align-items: center; justify-content: center; gap: 1rem; width: 100%;">
              <button id="prevDrawing" style="width: 2.4rem; min-width: 2.4rem; height: 2.4rem; border: 2px solid #1e88e5; background: white; color: #1e88e5; border-radius: 50%; font-size: 1.4rem; cursor: pointer;">‹</button>
              <button id="nextDrawing" style="width: 2.4rem; min-width: 2.4rem; height: 2.4rem; border: 2px solid #1e88e5; background: white; color: #1e88e5; border-radius: 50%; font-size: 1.4rem; cursor: pointer;">›</button>
            </div>
          </div>
        </div>
      </div>
      <div id="videoContainer" style="position: relative; max-width: 90vw; width: 900px; margin: 0 auto; display: none; text-align: center;">
        <button id="closeVideoContainer" style="position: absolute; top: 0.75rem; right: 0.75rem; z-index: 1; border: none; background: rgba(255,255,255,0.9); color: #1e88e5; border-radius: 50%; width: 2.5rem; height: 2.5rem; font-size: 1.2rem; cursor: pointer;">✕</button>
      <iframe id="videoIframe" src="https://player.vimeo.com/video/1216499641?title=0&amp;byline=0&amp;portrait=0&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" style="width: 90%; height: auto; aspect-ratio: 16 / 9; max-height: 90vh;" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="Gabi turns 18"></iframe>
    </div>
  </div>
  <script>
    const button = document.getElementById('playVideoButton');
    const container = document.getElementById('videoContainer');
    const iframe = document.getElementById('videoIframe');
    const nicknameHistoryButton = document.getElementById('nicknameHistoryButton');
    const nicknameOverlay = document.getElementById('nicknameOverlay');
    const nicknameOverlayTitle = nicknameOverlay.querySelector('h2');
    const closeNicknameOverlay = document.getElementById('closeNicknameOverlay');
    const drawingsHistoryButton = document.getElementById('drawingsHistoryButton');
    const drawingOverlay = document.getElementById('drawingOverlay');
    const drawingOverlayTitle = drawingOverlay.querySelector('h2');
    const closeDrawingOverlay = document.getElementById('closeDrawingOverlay');
    const prevDrawing = document.getElementById('prevDrawing');
    const nextDrawing = document.getElementById('nextDrawing');
    const centerImage = document.getElementById('centerImage');
    const drawingLabel = document.getElementById('drawingLabel');
    const languageSelectOverlay = document.getElementById('languageSelectOverlay');
    const languageButtons = Array.from(document.querySelectorAll('.languageButton'));
    const buttonGroup = document.getElementById('buttonGroup');
    let selectedVideoSrc = 'https://player.vimeo.com/video/1216499641';
    const buttonLabels = {
      pt: { nickname: 'Lista de apelidos', drawing: 'Histórico de desenhos', play: 'Reproduzir vídeo', videoSrc: 'https://player.vimeo.com/video/1216710818' },
      pl: { nickname: 'Lista przezwisk', drawing: 'Historia rysunków', play: 'Odtwórz wideo', videoSrc: 'https://player.vimeo.com/video/1216710835' },
      en: { nickname: 'Nickname list', drawing: 'Drawing history', play: 'Play video', videoSrc: 'https://player.vimeo.com/video/1216499641' }
    };
    const closeVideoContainer = document.getElementById('closeVideoContainer');

    const drawings = [
      'drawings/2012 faces.JPG',
      'drawings/2013 carrapato.JPG',
      'drawings/2013 fish.JPG',
      'drawings/2013 tatu bola.JPG',
      'drawings/2014 carta papai noel.JPG',
      'drawings/2015 cartoon.JPG',
      'drawings/2016 dr rozumek.JPG',
      'drawings/2016 whole family.jpg',
      'drawings/2017 animals.jpeg',
      'drawings/2018 quidditch.jpg',
      'drawings/2019 eye.jpg',
      'drawings/2019 owl.jpg',
      'drawings/2019 pałac nad wodą.jpg',
      'drawings/2020 girl.jpg',
      'drawings/2020 przewodniczaca.jpg',
      'drawings/2022 face.jpg',
      'drawings/2025 linkin park.JPG'
    ].sort((a, b) => a.localeCompare(b, 'pl', { sensitivity: 'base' }));
    let currentIndex = 0;

    function updateCarousel() {
      centerImage.src = drawings[currentIndex];
      const fileName = drawings[currentIndex].split('/').pop() || '';
      drawingLabel.textContent = fileName.slice(0, 4);
      prevDrawing.disabled = currentIndex === 0;
      nextDrawing.disabled = currentIndex === drawings.length - 1;
    }

    const playVideoButton = button;
    playVideoButton.addEventListener('click', async () => {
      iframe.src = `${selectedVideoSrc}?title=0&byline=0&portrait=0&badge=0&autopause=0&player_id=0&app_id=58479&autoplay=1`;
      container.style.display = 'block';
      playVideoButton.style.display = 'none';

      try {
        if (container.requestFullscreen) {
          await container.requestFullscreen();
        } else if (iframe.requestFullscreen) {
          await iframe.requestFullscreen();
        }
      } catch (error) {
        console.warn('Fullscreen request failed:', error);
      }
    });

    languageButtons.forEach((languageButton) => {
      languageButton.addEventListener('click', () => {
        const lang = languageButton.getAttribute('data-lang');
        const labels = buttonLabels[lang];
        nicknameHistoryButton.textContent = labels.nickname;
        nicknameOverlayTitle.textContent = labels.nickname;
        drawingsHistoryButton.textContent = labels.drawing;
        drawingOverlayTitle.textContent = labels.drawing;
        playVideoButton.textContent = labels.play;
        selectedVideoSrc = labels.videoSrc;
        languageSelectOverlay.style.display = 'none';
        buttonGroup.style.display = 'flex';
      });
    });

    closeVideoContainer.addEventListener('click', async () => {
      container.style.display = 'none';
      playVideoButton.style.display = '';
      iframe.src = 'about:blank';
      if (document.fullscreenElement) {
        try {
          await document.exitFullscreen();
        } catch (error) {
          console.warn('Failed to exit fullscreen:', error);
        }
      }
    });

    nicknameHistoryButton.addEventListener('click', () => {
      nicknameOverlay.style.display = 'flex';
    });

    drawingsHistoryButton.addEventListener('click', () => {
      drawingOverlay.style.display = 'flex';
      updateCarousel();
    });

    prevDrawing.addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex -= 1;
        updateCarousel();
      }
    });

    nextDrawing.addEventListener('click', () => {
      if (currentIndex < drawings.length - 1) {
        currentIndex += 1;
        updateCarousel();
      }
    });

    closeNicknameOverlay.addEventListener('click', () => {
      nicknameOverlay.style.display = 'none';
    });

    closeDrawingOverlay.addEventListener('click', () => {
      drawingOverlay.style.display = 'none';
    });

    nicknameOverlay.addEventListener('click', (event) => {
      if (event.target === nicknameOverlay) {
        nicknameOverlay.style.display = 'none';
      }
    });

    drawingOverlay.addEventListener('click', (event) => {
      if (event.target === drawingOverlay) {
        drawingOverlay.style.display = 'none';
      }
    });
  </script>
</body>
</html>
